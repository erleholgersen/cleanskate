name: Bug report
description: Report a problem with cleanskate
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a small code example, dataset version, or notebook cell when possible.
      render: python
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: cleanskate version
      placeholder: "0.1.0"
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
