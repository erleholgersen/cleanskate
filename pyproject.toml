[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanskate"
version = "0.1.0"
description = "Pandas-friendly access to figure skating scores"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Erle Holgersen" }]
keywords = ["figure skating", "sports analytics", "pandas", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.2",
  "platformdirs>=4.3",
  "pyarrow>=16.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.26",
  "ipython>=9.0",
  "matplotlib>=3.10",
  "pytest>=8.0",
  "seaborn>=0.13",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/erleholgersen/cleanskate"
Repository = "https://github.com/erleholgersen/cleanskate"
Issues = "https://github.com/erleholgersen/cleanskate/issues"
Documentation = "https://github.com/erleholgersen/cleanskate#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanskate"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".github/",
  ".pixi/",
  "dist/",
  ".pytest_cache/",
  ".gitignore",
  "pixi.toml",
  "pixi.lock",
]
